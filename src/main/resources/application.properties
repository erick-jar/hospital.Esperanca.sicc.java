# ===== Servidor =====
server.port=8080
spring.application.name=sicc-backend

# ===== Banco de Dados (H2 Local / PostgreSQL no Render) =====
# Se as variáveis do Render não existirem, ele usa o banco H2 local em arquivo por padrão
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/sicc}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# CORREÇÃO: Define o dialeto correto usando a propriedade padrão do Hibernate
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PLATFORM:org.hibernate.dialect.H2Dialect}

# SOLUÇÃO DO ERRO: Força o Hibernate a criar as tabelas antes de amarrar as Constraints de FK
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.order_inserts=true

# Ajuste temporário para limpar o cache corrompido do banco (mude para 'update' após iniciar a primeira vez)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# ===== Segurança =====
# Chave que assina o token JWT. Em produção, defina a variável de ambiente SICC_JWT_SEGREDO no Render.
sicc.jwt.segredo=${SICC_JWT_SEGREDO:troque-este-segredo-sicc-hospital-esperanca-2026-chave-de-desenvolvimento}
# Tempo de validade do token (8 horas)
sicc.jwt.expiracao-minutos=480
# Bloqueio após tentativas de login erradas
sicc.login.max-tentativas=5
sicc.login.minutos-bloqueio=15

# Endereço do front-end (Angular) autorizado a chamar a API
# Em produção, adicione a URL da Vercel/Render aqui separada por vírgula ou mude no painel
sicc.cors.origens=${SICC_CORS_ORIGENS:http://localhost:4200}

# ===== Dados iniciais =====
sicc.dados-iniciais=false