# ===== Servidor =====
server.port=8080
spring.application.name=sicc-backend

# ===== Banco de Dados (MySQL) =====
spring.datasource.url=jdbc:mysql://localhost:3306/sicc_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialeto do Hibernate para MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Força o Hibernate a criar as tabelas antes de amarrar as Constraints de FK
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.order_inserts=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ===== Segurança =====
sicc.jwt.segredo=${SICC_JWT_SEGREDO:troque-este-segredo-sicc-hospital-esperanca-2026-chave-de-desenvolvimento}
sicc.jwt.expiracao-minutos=480
sicc.login.max-tentativas=5
sicc.login.minutos-bloqueio=15
sicc.cors.origens=${SICC_CORS_ORIGENS:http://localhost:4200}

# ===== Dados iniciais =====
sicc.dados-iniciais=true
